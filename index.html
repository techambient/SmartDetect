<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambient SmartDetect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;500;800&display=swap');
        
        :root {
            --bg-light: #ffffff;
            --bg-dark: #050505;
        }

        body { 
            font-family: 'Bricolage Grotesque', sans-serif;
            overflow-x: hidden;
        }

        /* Mesh Gradient Background */
        .mesh-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-color: var(--bg-light);
            background-image: 
                radial-gradient(at 0% 0%, hsla(225,100%,90%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(270,100%,90%,1) 0, transparent 50%);
        }

        @media (prefers-color-scheme: dark) {
            .mesh-gradient {
                background-color: var(--bg-dark);
                background-image: 
                    radial-gradient(at 0% 0%, hsla(225,100%,15%,1) 0, transparent 50%), 
                    radial-gradient(at 100% 100%, hsla(270,100%,10%,1) 0, transparent 50%);
            }
        }

        .bento-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 32px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @media (prefers-color-scheme: dark) {
            .bento-card {
                background: rgba(20, 20, 20, 0.6);
                border: 1px solid rgba(255, 255, 255, 0.05);
            }
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .scan-line {
            height: 2px;
            background: #3b82f6;
            box-shadow: 0 0 15px #3b82f6;
            position: absolute;
            width: 100%;
            top: 0;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
</head>
<body class="text-slate-900 dark:text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="mesh-gradient"></div>

    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <div class="bento-card md:col-span-3 p-8 flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="flex items-center gap-5">
                <div class="p-4 bg-blue-600 rounded-2xl shadow-2xl shadow-blue-500/20">
                    <i data-lucide="shield-half" class="text-white w-8 h-8"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-extrabold tracking-tighter">Ambient <span class="text-blue-600">SmartDetect</span></h1>
                    <p class="text-slate-500 dark:text-slate-400 text-sm font-medium">Ambient Enterprise Phishing Intelligence</p>
                </div>
            </div>
            <div class="flex gap-2">
                <span class="px-4 py-2 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 rounded-full text-xs font-bold border border-emerald-500/20 flex items-center gap-2">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span> Live Database
                </span>
            </div>
        </div>

        <div class="bento-card md:col-span-2 p-8 relative overflow-hidden">
            <div id="scanLine" class="scan-line hidden"></div>
            <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                <i data-lucide="search" class="w-5 h-5"></i> Phish Inspector
            </h2>
            <div class="relative group">
                <input type="text" id="urlInput" 
                    class="w-full bg-slate-100/50 dark:bg-black/40 border-2 border-transparent focus:border-blue-500 rounded-2xl py-6 px-6 text-xl outline-none transition-all placeholder:text-slate-400 font-medium mb-4"
                    placeholder="Enter suspicious link...">
                <button onclick="checkPhishing()" 
                    class="w-full bg-slate-900 dark:bg-white text-white dark:text-black font-extrabold py-5 rounded-2xl hover:scale-[1.01] active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                    Check Threats
                </button>
            </div>
        </div>

        <div class="bento-card p-8 flex flex-col justify-center items-center text-center">
            <div class="text-4xl font-black text-blue-600 mb-2">49.99%</div>
            <div class="text-xs font-bold uppercase tracking-widest text-slate-400">Detection Accuracy</div>
            <hr class="w-full my-4 border-slate-200 dark:border-slate-800">
            <div class="flex -space-x-2">
                <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 border-2 border-white dark:border-black flex items-center justify-center text-[10px] font-bold">JS</div>
                <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 border-2 border-white dark:border-black flex items-center justify-center text-[10px] font-bold">GS</div>
                <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 border-2 border-white dark:border-black flex items-center justify-center text-[10px] font-bold">API</div>
            </div>
        </div>

        <div id="resultBox" class="bento-card md:col-span-3 p-12 hidden animate-in fade-in zoom-in duration-500">
            <div id="statusContent" class="flex flex-col items-center">
                <div id="statusIconContainer" class="mb-6"></div>
                <h3 id="statusHeading" class="text-4xl font-black mb-4"></h3>
                <p id="statusDesc" class="max-w-md text-center text-slate-500 dark:text-slate-400 leading-relaxed"></p>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        async function checkPhishing() {
            const input = document.getElementById('urlInput');
            const resultBox = document.getElementById('resultBox');
            const scanLine = document.getElementById('scanLine');
            const statusContent = document.getElementById('statusContent');
            const iconContainer = document.getElementById('statusIconContainer');
            const heading = document.getElementById('statusHeading');
            const desc = document.getElementById('statusDesc');

            const scriptUrl = "https://script.google.com/macros/s/AKfycbziwR2UqmSgVhdcFd8m5MWyMkgV8rFSfcu1hjsCDQQbTA5keb3TTdyHijslJegfjqvW/exec";

            if (!input.value) return;

            // UI Feedback
            scanLine.classList.remove('hidden');
            resultBox.classList.add('hidden');

            try {
                const response = await fetch(`${scriptUrl}?url=${encodeURIComponent(input.value)}`);
                const result = await response.text();

                scanLine.classList.add('hidden');
                resultBox.classList.remove('hidden');
                
                if (result === "phishing") {
                    iconContainer.innerHTML = '<div class="bg-red-500 p-6 rounded-[2.5rem] shadow-2xl shadow-red-500/50"><i data-lucide="skull" class="text-white w-12 h-12"></i></div>';
                    heading.innerText = "Threat Found";
                    heading.className = "text-4xl font-black mb-4 text-red-600";
                    desc.innerText = "Our engine has flagged this URL as a malicious phishing attempt. Interaction with this site is dangerous.";
                } else {
                    iconContainer.innerHTML = '<div class="bg-emerald-500 p-6 rounded-[2.5rem] shadow-2xl shadow-emerald-500/50"><i data-lucide="check-circle-2" class="text-white w-12 h-12"></i></div>';
                    heading.innerText = "Secure Link";
                    heading.className = "text-4xl font-black mb-4 text-emerald-600";
                    desc.innerText = "No matches found in our database. This URL currently shows no known indicators of phishing behavior.";
                }
                lucide.createIcons();
            } catch (e) {
                alert("Network timeout. Please ensure your script is deployed as 'Anyone'.");
            }
        }
    </script>
</body>
</html>
